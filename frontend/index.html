<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Order</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Stock Order</h1>
        <p class="subtitle">Enter your credentials and order details.</p>

        <form id="orderForm">

            <!-- ID -->
            <div class="form-group">
                <label for="userId">ID</label>
                <input
                    type="text"
                    id="userId"
                    name="id"
                    placeholder="Enter ID"
                    required
                >
            </div>


            <!-- API KEY -->
            <div class="form-group">
                <label for="apiKey">API Key</label>
                <input
                    type="password"
                    id="apiKey"
                    name="api_key"
                    placeholder="Enter API key"
                    autocomplete="off"
                    required
                >
            </div>

            <!-- SECRET KEY -->
            <div class="form-group">
                <label for="secretKey">Secret Key</label>
                <input
                    type="password"
                    id="secretKey"
                    name="secret_key"
                    placeholder="Enter secret key"
                    autocomplete="off"
                    required
                >
            </div>

            <!-- BUY / SELL -->
            <div class="form-group">
                <label>Order Type</label>

                <div class="order-type">

                    <label class="radio-option buy-option">
                        <input
                            type="radio"
                            name="side"
                            value="BUY"
                            checked
                        >
                        <span>BUY</span>
                    </label>

                    <label class="radio-option sell-option">
                        <input
                            type="radio"
                            name="side"
                            value="SELL"
                        >
                        <span>SELL</span>
                    </label>

                </div>
            </div>


            <!-- STOCK (SEARCHABLE) -->
            <div class="form-group">
                <label for="stockSearch">Stock</label>

                <div class="stock-row">
                    <div class="custom-select-wrapper">
                        <!-- Hidden input stores the actual selected value for form submission -->
                        <input type="hidden" id="stock" name="stock" required>

                        <!-- Visible input for typing and filtering -->
                        <input
                            type="text"
                            id="stockSearch"
                            placeholder="Search ticker (e.g. AAPL)..."
                            autocomplete="off"
                        >

                        <!-- Searchable Dropdown Menu -->
                        <div id="stockDropdown" class="dropdown-menu">
                            <div id="stockOptions" class="options-list">
                                <div class="dropdown-item message-item">Loading stocks...</div>
                            </div>
                        </div>
                    </div>

                    <button
                        type="button"
                        id="refreshStocks"
                        class="secondary-button"
                        title="Reload stocks"
                    >
                        ↻
                    </button>
                </div>
            </div>

            <!-- PRICE (optional/market order ) -->
            <div class="form-group">
                <label for="price" id="priceLabel">Price (Optional - Leave blank for Market Order)</label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.001"
                    placeholder="Market Price (Leave empty)"
                >
            </div>

            <!-- AMOUNT with MAX button -->
            <div class="form-group">
                <label for="amount">Amount</label>

                <div class="amount-row">
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                    <button type="button" id="maxAmountBtn" class="secondary-button max-btn">MAX</button>
                </div>
            </div>

            <!-- ORDER PREVIEW -->
            <div id="orderPreview" class="order-preview">
                <div>
                    <span>Side</span>
                    <strong id="previewSide">BUY</strong>
                </div>

                <div>
                    <span>Stock</span>
                    <strong id="previewStock">—</strong>
                </div>

                <div>
                    <span>Price</span>
                    <strong id="previewPrice">0.000</strong>
                </div>

                <div>
                    <span>Amount</span>
                    <strong id="previewAmount">0.00</strong>
                </div>
            </div>

            <!-- STATUS MESSAGE -->
            <div id="message" class="message"></div>

            <!-- SUBMIT -->
            <button
                type="submit"
                id="submitButton"
                class="submit-button buy-button"
            >
                SUBMIT BUY ORDER
            </button>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
