<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stock Order</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <div class="account-bar">

            <div class="account-info">

                <img
                    id="userPicture"
                    class="user-picture"
                    alt="Google profile picture"
                    hidden
                >

                <div>
                    <span class="account-label">
                        Signed in as
                    </span>

                    <strong id="userName">
                        Loading...
                    </strong>
                </div>

            </div>

            <a
                href="/logout"
                class="logout-button"
            >
                Logout
            </a>

        </div>


        <h1>Stock Order</h1>

        <p class="subtitle">
            Submit paper-trading orders using the Alpaca account configured on the server.
        </p>


        <form id="orderForm">


            <div class="form-group">

                <label>Order Type</label>

                <div class="order-type">

                    <label class="radio-option buy-option">

                        <input
                            type="radio"
                            name="side"
                            value="BUY"
                            checked
                        >

                        <span>BUY</span>

                    </label>


                    <label class="radio-option sell-option">

                        <input
                            type="radio"
                            name="side"
                            value="SELL"
                        >

                        <span>SELL</span>

                    </label>

                </div>

            </div>


            <div class="form-group">

                <label for="stockSearch">
                    Stock
                </label>

                <div class="stock-row">

                    <div class="custom-select-wrapper">

                        <input
                            type="hidden"
                            id="stock"
                            name="stock"
                            required
                        >

                        <input
                            type="text"
                            id="stockSearch"
                            placeholder="Search ticker (e.g. AAPL)..."
                            autocomplete="off"
                        >

                        <div
                            id="stockDropdown"
                            class="dropdown-menu"
                        >

                            <div
                                id="stockOptions"
                                class="options-list"
                            >

                                <div class="dropdown-item message-item">
                                    Loading stocks...
                                </div>

                            </div>

                        </div>

                    </div>


                    <button
                        type="button"
                        id="refreshStocks"
                        class="secondary-button"
                        title="Reload stocks"
                    >
                        ↻
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label
                    for="price"
                    id="priceLabel"
                >
                    Buy Price (Optional - Leave blank for Market Order)
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.001"
                    placeholder="Market Price (Leave empty)"
                >

            </div>


            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <div class="amount-row">

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                    <button
                        type="button"
                        id="maxAmountBtn"
                        class="secondary-button max-btn"
                    >
                        MAX
                    </button>

                </div>

            </div>


            <div
                id="orderPreview"
                class="order-preview"
            >

                <div>
                    <span>Side</span>
                    <strong id="previewSide">
                        BUY
                    </strong>
                </div>

                <div>
                    <span>Stock</span>
                    <strong id="previewStock">
                        —
                    </strong>
                </div>

                <div>
                    <span>Price</span>
                    <strong id="previewPrice">
                        MARKET
                    </strong>
                </div>

                <div>
                    <span>Amount</span>
                    <strong id="previewAmount">
                        0.00
                    </strong>
                </div>

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <button
                type="submit"
                id="submitButton"
                class="submit-button buy-button"
            >
                SUBMIT BUY ORDER
            </button>

        </form>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
